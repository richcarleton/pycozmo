<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>purrter lab</title>
<style>
:root{--bg:#0e0f11;--panel:#17191c;--line:#26292e;--fg:#e6e6e3;--dim:#8b8f96;
  --cyan:#3fd7e0;--ok:#4ccf6a;--warn:#e8b33c;--bad:#e5534b;color-scheme:dark}
:root[data-theme=light]{--bg:#f2f1ed;--panel:#fff;--line:#dcdad3;--fg:#1c1d1f;--dim:#6b6e73;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 ui-sans-serif,system-ui,sans-serif;
  padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
h1{font:600 17px ui-monospace,monospace;margin:0;letter-spacing:.02em}
#dot{width:10px;height:10px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px currentColor}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip{font:12px ui-monospace,monospace;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.chip.on{color:var(--fg);border-color:var(--cyan)}
.chip.alert{color:var(--bad);border-color:var(--bad)}
.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.card h2{font:600 11px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin:0 0 10px}
.stack{display:grid;gap:14px;align-content:start}
#feed{display:block;width:100%;aspect-ratio:4/3;background:#000;border-radius:6px;image-rendering:pixelated;object-fit:cover}
.feedbar{display:flex;justify-content:space-between;color:var(--dim);font:12px ui-monospace,monospace;margin-top:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent}
.seg button.sel{background:var(--cyan);color:#071012;font-weight:600}
button{font:inherit;color:var(--fg);background:var(--line);border:1px solid var(--line);border-radius:8px;
  padding:10px 12px;cursor:pointer;touch-action:manipulation;min-height:42px}
button:active{filter:brightness(1.3)}
button.danger{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.row input[type=text]{flex:1;min-width:0}
input[type=text]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:42px}
label.sl{display:grid;grid-template-columns:44px 1fr 52px;align-items:center;gap:8px;color:var(--dim);font-size:12px}
input[type=range]{width:100%;accent-color:var(--cyan)}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,64px);gap:6px;justify-content:center;margin:6px 0}
.pad button{font-size:20px;padding:0;user-select:none;-webkit-user-select:none}
.pad .x{grid-column:2;grid-row:2}
.locked{opacity:.4;pointer-events:none}
.hint{color:var(--dim);font-size:12px;margin:6px 0 0}
#log{font:12px/1.5 ui-monospace,monospace;color:var(--dim);max-height:260px;overflow:auto;white-space:pre-wrap;margin:0}
#cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
#cats img{width:100%;border-radius:6px;display:block}
.empty{color:var(--dim);font-size:12px}
.theme{background:none;border:1px solid var(--line);min-height:30px;padding:4px 9px;font-size:12px}
</style></head>
<body>
<header>
  <span id="dot"></span><h1>purrter lab</h1>
  <button class="theme" id="theme" title="Toggle theme">◐</button>
  <div class="chips" id="chips"></div>
</header>

<div class="grid">
  <div class="stack">
    <div class="card">
      <img id="feed" alt="Cozmo camera">
      <div class="feedbar"><span id="frames">—</span><span id="motion">motion —</span></div>
    </div>
    <div class="card">
      <h2>Mode</h2>
      <div class="seg"><button data-mode="doorman">🐈 Doorman</button><button data-mode="play">🕹 Play</button></div>
      <p class="hint" id="modehint"></p>
    </div>
    <div class="card" id="drivecard">
      <h2>Drive <span style="text-transform:none;letter-spacing:0">· hold · or WASD</span></h2>
      <div class="pad">
        <button style="grid-column:2" data-d="f">▲</button>
        <button style="grid-column:1;grid-row:2" data-d="l">◀</button>
        <button class="danger x" id="stop">■</button>
        <button style="grid-column:3;grid-row:2" data-d="r">▶</button>
        <button style="grid-column:2;grid-row:3" data-d="b">▼</button>
      </div>
      <label class="sl">speed<input type="range" id="speed" min="20" max="150" value="60"><span id="speedv">60</span></label>
    </div>
  </div>

  <div class="stack">
    <div class="card">
      <h2>Head &amp; lift</h2>
      <label class="sl">head<input type="range" id="head" step="0.01"><span id="headv">—</span></label>
      <label class="sl" id="liftrow">lift<input type="range" id="lift" step="1"><span id="liftv">—</span></label>
    </div>
    <div class="card">
      <h2>Face</h2>
      <div class="row"><input type="text" id="facetext" placeholder="text for his screen" maxlength="40"><button id="facego">Show</button></div>
      <div class="row" style="margin-top:8px"><button id="facecat">🐈 Cat</button><button id="faceclear">Clear</button></div>
    </div>
    <div class="card">
      <h2>Speak</h2>
      <div class="row"><input type="text" id="saytext" placeholder="say something through Cozmo" maxlength="200"><button id="saygo">Say</button></div>
      <div class="row" style="margin-top:8px"><button id="voice">🎙 Listen: off</button><span class="hint" id="heard"></span></div>
      <p class="hint">PC mic → Vosk. Try “what's the time”, “hello”, “show cat”, “look up”, “battery”.</p>
    </div>
    <div class="card">
      <h2>Log</h2><pre id="log"></pre>
    </div>
  </div>
</div>

<div class="card" style="margin-top:14px">
  <h2>Cat sightings <span id="lastcat" style="text-transform:none;letter-spacing:0"></span></h2>
  <div id="cats"><span class="empty">None yet.</span></div>
</div>

<script>
const $ = s => document.querySelector(s);
const post = (url, data) => fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data||{})})
  .then(r => r.json()).then(j => { if(!j.ok && j.error) flash(j.error); return j; }).catch(()=>flash('server offline'));
function flash(msg){ const h=$('#modehint'); h.textContent=msg; h.style.color='var(--warn)'; setTimeout(()=>{h.style.color='';render.mode && setHint(render.mode)},2500); }

// theme (dark default, remembered per browser)
const root=document.documentElement;
try{ if(localStorage.getItem('purrter-theme')==='light') root.dataset.theme='light'; }catch(e){}
$('#theme').onclick=()=>{ root.dataset.theme = root.dataset.theme==='light' ? '' : 'light';
  try{ localStorage.setItem('purrter-theme', root.dataset.theme||'dark'); }catch(e){} };

$('#feed').src = '/video';
$('#feed').onerror = () => setTimeout(()=>{ $('#feed').src='/video?'+Date.now(); }, 2000);

// mode
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => post('/api/mode',{mode:b.dataset.mode}).then(tick));
function setHint(m){ $('#modehint').textContent = m==='doorman'
  ? 'Parked and watching the door. Driving & lift locked so he stays on the shelf.'
  : 'Driving unlocked. Put him on the floor first — off the charger he has about an hour.'; }

// drive: hold-to-drive, resent every 150 ms; server stops wheels 0.4 s after the last one
let driveTimer=null;
const dirs={f:[1,1],b:[-1,-1],l:[-0.6,0.6],r:[0.6,-0.6]};
function startDrive(d){ stopDrive(false); const send=()=>{const s=+$('#speed').value,[a,b]=dirs[d]; post('/api/drive',{l:a*s,r:b*s});};
  send(); driveTimer=setInterval(send,150); }
function stopDrive(hard=true){ if(driveTimer){clearInterval(driveTimer);driveTimer=null; if(hard) post('/api/stop');} }
document.querySelectorAll('[data-d]').forEach(b=>{
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);startDrive(b.dataset.d);});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>stopDrive()));
});
$('#stop').onclick=()=>{stopDrive(false);post('/api/stop');};
const keys={w:'f',s:'b',a:'l',d:'r',ArrowUp:'f',ArrowDown:'b',ArrowLeft:'l',ArrowRight:'r'};
let held=null;
addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT'&&e.target.type==='text')return;
  const d=keys[e.key]; if(d&&held!==d){held=d;startDrive(d);e.preventDefault();} if(e.key===' '){stopDrive();e.preventDefault();} });
addEventListener('keyup',e=>{ if(keys[e.key]===held){held=null;stopDrive();} });
addEventListener('blur',()=>{held=null;stopDrive();});
$('#speed').oninput=e=>$('#speedv').textContent=e.target.value;

// sliders (throttled)
function throttled(fn,ms=120){let t=0,last;return v=>{last=v;const now=Date.now();if(now-t>ms){t=now;fn(v);}else setTimeout(()=>{if(Date.now()-t>=ms){t=Date.now();fn(last);}},ms);};}
const sendHead=throttled(v=>post('/api/head',{angle:+v})), sendLift=throttled(v=>post('/api/lift',{mm:+v}));
let dragging=false;
['head','lift'].forEach(id=>{const el=$('#'+id);
  el.addEventListener('pointerdown',()=>dragging=true); el.addEventListener('pointerup',()=>dragging=false);
  el.oninput=()=>{ $('#'+id+'v').textContent=el.value; (id==='head'?sendHead:sendLift)(el.value); }; });

// face + speech
$('#facego').onclick=()=>post('/api/face',{text:$('#facetext').value});
$('#facetext').onkeydown=e=>{if(e.key==='Enter')$('#facego').click();};
$('#facecat').onclick=()=>post('/api/face',{preset:'cat'});
$('#faceclear').onclick=()=>post('/api/face',{preset:'clear'});
$('#saygo').onclick=()=>{const t=$('#saytext').value.trim(); if(t) post('/api/say',{text:t}).then(()=>$('#saytext').value='');};
$('#saytext').onkeydown=e=>{if(e.key==='Enter')$('#saygo').click();};
let voiceOn=false;
$('#voice').onclick=()=>post('/api/voice',{on:!voiceOn}).then(tick);

// status loop
let limitsSet=false;
function chip(label,on,alert){return `<span class="chip ${alert?'alert':on?'on':''}">${label}</span>`;}
function render(s){
  render.mode=s.mode;
  $('#dot').style.background = s.connected ? 'var(--ok)' : 'var(--bad)';
  $('#dot').style.color = s.connected ? 'var(--ok)' : 'var(--bad)';
  const r=s.robot||{};
  $('#chips').innerHTML = s.connected
    ? chip(`${(r.battery??0).toFixed(2)} V`, r.battery>3.6, r.battery && r.battery<3.5)
      + chip('charging', r.charging) + chip('on charger', r.on_charger)
      + (r.picked_up?chip('picked up',0,1):'') + (r.cliff?chip('cliff!',0,1):'')
      + chip('yolo '+s.yolo, s.yolo==='ready')
    : chip('cozmo offline',0,1);
  document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('sel',b.dataset.mode===s.mode));
  $('#drivecard').classList.toggle('locked', s.mode!=='play');
  $('#liftrow').classList.toggle('locked', s.mode!=='play');
  if(!$('#modehint').style.color) setHint(s.mode);
  $('#frames').textContent = `frames ${s.frames}`;
  $('#motion').textContent = s.mode==='doorman' ? `motion ${s.motion}%` : 'motion paused';
  if(s.limits && !limitsSet){ limitsSet=true;
    Object.assign($('#head'),{min:s.limits.head[0],max:s.limits.head[1]});
    Object.assign($('#lift'),{min:s.limits.lift[0],max:s.limits.lift[1]}); }
  if(!dragging && r.head!==undefined){ $('#head').value=r.head; $('#headv').textContent=r.head; $('#lift').value=r.lift; $('#liftv').textContent=r.lift; }
  voiceOn=s.voice;
  $('#voice').textContent = s.voice_ok===false ? '🎙 voice unavailable' : `🎙 Listen: ${s.voice?'on':'off'}`;
  $('#voice').disabled = s.voice_ok===false;
  $('#heard').textContent = s.heard ? `“${s.heard}”` : '';
  $('#log').textContent = s.log.join('\n');
  $('#lastcat').textContent = s.last_cat ? `· last ${s.last_cat}` : '';
  $('#cats').innerHTML = s.cats.length
    ? s.cats.map(f=>`<a href="/cats/${encodeURIComponent(f)}" target="_blank"><img src="/cats/${encodeURIComponent(f)}" loading="lazy" alt="cat"></a>`).join('')
    : '<span class="empty">None yet.</span>';
}
function tick(){ return fetch('/api/status').then(r=>r.json()).then(render)
  .catch(()=>{ $('#dot').style.background='var(--bad)'; $('#chips').innerHTML=chip('server offline',0,1); }); }
tick(); setInterval(tick, 1500);
</script>
</body></html>
